$kind: http-request
description: |-
  Ouvre une session Traccar avec des identifiants Traccar. Route publique.
method: POST
url: "{{baseUrl}}/traccar/session"
order: 1000
headers:
  - key: "Content-Type"
    value: "application/json"
body:
  type: json
  content: |-
    {
      "email": "client@example.com",
      "password": "<mot de passe Traccar>"
    }
auth:
  type: noauth
