$kind: http-request
description: |-
  `support`, `super_admin`. Note interne, ni modifiable ni supprimable. 1 à 2000 caractères.
method: POST
url: "{{baseUrl}}/admin/v1/clients/:uid/notes"
order: 3000
pathVariables:
  - key: "uid"
    value: "uid_client_123"
    description: "UID Firebase"
headers:
  - key: "Content-Type"
    value: "application/json"
  - key: "Idempotency-Key"
    value: "{{$guid}}"
    description: "Optionnel. Rejouer avec la même clé renvoie la réponse déjà calculée (24 h). 409 si en cours, 422 si le corps diffère."
body:
  type: json
  content: |-
    {
      "body": "Client rappelé, boîtier remplacé."
    }
examples: "./.resources/Ajouter une note.resources/examples"
