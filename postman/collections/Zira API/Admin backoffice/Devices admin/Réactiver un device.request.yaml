$kind: http-request
description: |-
  `support`, `super_admin`.
method: POST
url: "{{baseUrl}}/admin/v1/devices/:deviceId/enable"
order: 6000
pathVariables:
  - key: "deviceId"
    value: "42"
    description: "ID Traccar"
headers:
  - key: "Content-Type"
    value: "application/json"
  - key: "Idempotency-Key"
    value: "{{$guid}}"
    description: "Optionnel. Rejouer avec la même clé renvoie la réponse déjà calculée (24 h). 409 si en cours, 422 si le corps diffère."
body:
  type: json
  content: |-
    {
      "reason": "Demande du client par téléphone (ticket #1234)"
    }
examples: "./.resources/Réactiver un device.resources/examples"
