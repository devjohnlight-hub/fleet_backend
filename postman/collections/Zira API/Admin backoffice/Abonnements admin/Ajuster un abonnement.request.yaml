$kind: http-request
description: |-
  `billing`, `super_admin`. Au moins un champ parmi `planId`, `status`, `endDate`.

  - `planId` recopie aussi les `permissions` du plan (`free`, `starter`, `pro`, `business`).
  - `status` : `trial`, `active`, `expired`, `cancelled` (les deux derniers sont à confirmer côté Cloud Functions).
  - `endDate` après `startDate` ; future pour `active`/`trial`, passée pour `expired`.
  - `trialEndDate` n'est pas modifié.
method: POST
url: "{{baseUrl}}/admin/v1/subscriptions/:uid/adjustments"
order: 1000
pathVariables:
  - key: "uid"
    value: "uid_client_123"
    description: "UID Firebase"
headers:
  - key: "Content-Type"
    value: "application/json"
  - key: "Idempotency-Key"
    value: "{{$guid}}"
    description: "Optionnel. Rejouer avec la même clé renvoie la réponse déjà calculée (24 h). 409 si en cours, 422 si le corps diffère."
body:
  type: json
  content: |-
    {
      "planId": "pro",
      "status": "active",
      "endDate": "2026-12-31T23:59:59Z",
      "reason": "Demande du client par téléphone (ticket #1234)"
    }
examples: "./.resources/Ajuster un abonnement.resources/examples"
