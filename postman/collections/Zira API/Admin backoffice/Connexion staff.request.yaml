$kind: http-request
description: |-
  Connexion avec un compte staff. Le script enregistre le token dans `staffIdToken`.

  Un changement de rôle révoque les sessions : se reconnecter ensuite.
method: POST
url: "{{baseUrl}}/users/login"
order: 1000
headers:
  - key: "Content-Type"
    value: "application/json"
body:
  type: json
  content: |-
    {
      "email": "{{staffEmail}}",
      "password": "{{staffPassword}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const res = pm.response.json();
      if (pm.response.code === 201 && res.data && res.data.token) {
        pm.environment.set('staffIdToken', res.data.token);
      }
examples: "./.resources/Connexion staff.resources/examples"
