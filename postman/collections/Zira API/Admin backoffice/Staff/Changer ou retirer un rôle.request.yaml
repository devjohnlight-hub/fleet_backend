$kind: http-request
description: |-
  `role: null` retire l'accès staff.
method: PATCH
url: "{{baseUrl}}/admin/v1/staff/:uid"
order: 3000
pathVariables:
  - key: "uid"
    value: "uid_staff_1"
    description: "UID Firebase"
headers:
  - key: "Content-Type"
    value: "application/json"
  - key: "Idempotency-Key"
    value: "{{$guid}}"
    description: "Optionnel. Rejouer avec la même clé renvoie la réponse déjà calculée (24 h). 409 si en cours, 422 si le corps diffère."
body:
  type: json
  content: |-
    {
      "role": "billing",
      "reason": "Demande du client par téléphone (ticket #1234)"
    }
examples: "./.resources/Changer ou retirer un rôle.resources/examples"
