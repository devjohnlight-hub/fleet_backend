$kind: http-example
name: "Pas staff"
order: 3000
request:
  url: "{{baseUrl}}/admin/v1/staff/:uid"
  method: PATCH
response:
  statusCode: 404
  statusText: "Not Found"
  headers:
    - key: Content-Type
      value: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "success": false,
        "message": "Ce compte n'est pas staff : utiliser POST /admin/v1/staff",
        "data": null
      }
