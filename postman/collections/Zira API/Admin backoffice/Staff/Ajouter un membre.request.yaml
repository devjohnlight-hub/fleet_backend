$kind: http-request
description: |-
  Donne un rôle à un compte Firebase **existant** (pas de création de compte). 409 si déjà staff.
method: POST
url: "{{baseUrl}}/admin/v1/staff"
order: 2000
headers:
  - key: "Content-Type"
    value: "application/json"
  - key: "Idempotency-Key"
    value: "{{$guid}}"
    description: "Optionnel. Rejouer avec la même clé renvoie la réponse déjà calculée (24 h). 409 si en cours, 422 si le corps diffère."
body:
  type: json
  content: |-
    {
      "email": "support@zira.ci",
      "role": "support",
      "reason": "Demande du client par téléphone (ticket #1234)"
    }
examples: "./.resources/Ajouter un membre.resources/examples"
