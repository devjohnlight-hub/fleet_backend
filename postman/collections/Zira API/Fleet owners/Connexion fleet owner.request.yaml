$kind: http-request
description: |-
  Renvoie un JWT, enregistré dans `fleetOwnerJwt`.
method: POST
url: "{{baseUrl}}/fleet-owners/login"
order: 2000
headers:
  - key: "Content-Type"
    value: "application/json"
body:
  type: json
  content: |-
    {
      "email": "owner@example.com",
      "password": "<mot de passe>"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const res = pm.response.json();
      if (res.data && res.data.accessToken) pm.environment.set('fleetOwnerJwt', res.data.accessToken);
examples: "./.resources/Connexion fleet owner.resources/examples"
