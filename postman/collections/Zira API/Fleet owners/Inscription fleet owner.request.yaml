$kind: http-request
description: |-
  Crée un fleet owner et renvoie un JWT.
method: POST
url: "{{baseUrl}}/fleet-owners/register"
order: 1000
headers:
  - key: "Content-Type"
    value: "application/json"
body:
  type: json
  content: |-
    {
      "name": "Transports Koné",
      "email": "owner@example.com",
      "password": "MotDePasse!2026"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const res = pm.response.json();
      if (res.data && res.data.accessToken) pm.environment.set('fleetOwnerJwt', res.data.accessToken);
examples: "./.resources/Inscription fleet owner.resources/examples"
