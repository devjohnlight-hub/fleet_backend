$kind: http-example
name: "Uploadé"
order: 1000
request:
  url: "{{baseUrl}}/files/upload?folder=fleet"
  method: POST
response:
  statusCode: 201
  statusText: "Created"
  headers:
    - key: Content-Type
      value: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "success": true,
        "message": "Succès",
        "data": {
          "url": "https://res.cloudinary.com/demo/raw/upload/v1/fleet/doc.pdf"
        }
      }
