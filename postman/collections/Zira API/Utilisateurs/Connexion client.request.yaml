$kind: http-request
description: |-
  Échange email / mot de passe contre un **ID token Firebase** (valide 1 h). Route publique.

  Le script enregistre le token dans la variable d'environnement `firebaseIdToken`.
method: POST
url: "{{baseUrl}}/users/login"
order: 2000
headers:
  - key: "Content-Type"
    value: "application/json"
body:
  type: json
  content: |-
    {
      "email": "{{clientEmail}}",
      "password": "{{clientPassword}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const res = pm.response.json();
      if (pm.response.code === 201 && res.data && res.data.token) {
        pm.environment.set('firebaseIdToken', res.data.token);
      }
examples: "./.resources/Connexion client.resources/examples"
